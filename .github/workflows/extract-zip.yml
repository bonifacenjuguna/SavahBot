name: Extract committed SavahBot archive

on:
  push:
    branches:
      - savahbot-zip-extraction
    paths:
      - .github/workflows/extract-zip.yml
      - SavahBot-repo-setup.zip

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v4
        with:
          ref: savahbot-zip-extraction

      - name: Extract archive into an isolated folder
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path("SavahBot-repo-setup.zip")
          if not archive.is_file():
              raise SystemExit(f"Archive not found: {archive}")

          destination = Path("_zip-extracted")
          destination.mkdir(exist_ok=True)

          with ZipFile(archive) as zf:
              for member in zf.infolist():
                  member_path = PurePosixPath(member.filename)
                  if member_path.is_absolute() or ".." in member_path.parts:
                      raise SystemExit(f"Unsafe archive path: {member.filename}")
              zf.extractall(destination)

          files = sorted(p for p in destination.rglob("*") if p.is_file())
          print(f"Extracted {len(files)} files.")
          for path in files[:200]:
              print(path.as_posix())
          if not files:
              raise SystemExit("The archive contained no files.")
          PY

      - name: Commit extracted files on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _zip-extracted
          git commit -m "Extract newer SavahBot project archive"
          git push origin savahbot-zip-extraction
