<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#131c33" />
    <meta name="robots" content="noindex" />
    <title>Offline · SavahBot</title>
    <style>
      :root { --bg: #e6e9ee; --panel: #f6f7f9; --line: #cdd3dd; --ink: #131c33; --muted: #566176; --accent: #2442d6; --accent-ink: #fff; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f131b; --panel: #171c26; --line: #2b3342; --ink: #e5e9f1; --muted: #9aa5ba; --accent: #7d95ff; --accent-ink: #0b1020; color-scheme: dark; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
        background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      main { width: min(420px, 100%); text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 32px 24px; }
      .mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; background: #131c33; display: grid; place-items: center; color: #fff; }
      h1 { margin: 0 0 8px; font-size: 1.35rem; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; color: var(--muted); }
      button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 22px; border-radius: 10px; border: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      small { display: block; margin-top: 18px; color: var(--muted); font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="88 88 1080 1080" width="38" height="38" fill="none"><path d="M150 897C165 760 185 620 200 520C235 300 400 168 627 168C855 168 1020 300 1055 520C1070 620 1090 760 1104 897L985 872C900 980 770 1040 627 1040C485 1040 355 980 270 872Z" stroke="currentColor" stroke-width="78" stroke-linejoin="round"/><rect x="467" y="512" width="93" height="185" rx="20" fill="currentColor"/><rect x="695" y="512" width="93" height="185" rx="20" fill="currentColor"/><path d="M503 757C570 785 690 785 748 752C735 790 690 832 627 832C565 832 525 795 503 757Z" fill="currentColor" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/></svg>
      </div>
      <h1>You are offline</h1>
      <p>SavahBot needs a connection to reach your bot. It will reopen as soon as you are back online.</p>
      <button type="button" id="retry">Try again</button>
      <small>Nothing from your account is stored on this device for offline use.</small>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () { location.reload(); });
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
